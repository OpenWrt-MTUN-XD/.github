name: Profile Summary Cards

on:
  schedule:
    - cron: '0 16 * * *'      # 每天 UTC 16:00（北京时间 00:00）
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成统计卡片
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: OpenWrt-MTUN-XD
          BRANCH: main
          UTC_OFFSET: 8
          THEME: github_dark
